upport arranged together?", "burden": "Could the family add two clinic trips each week and supervise a long practice block after school?", "feasibleReply": "That fits. I can try it without missing my responsibilities.", "burdenReply": "We cannot arrange that. Missing practice would not mean I do not care.", "review": "In this fictional follow-up, I asked my teacher a question twice and used less jaw effort. I still stuttered. The teasing also needs a school response.", "reviewGood": "Let us count the participation and effort changes, check the school response, and ask what step you want next.", "reviewOther": "Since stuttering is still audible, should we repeat the same tasks until the count drops before changing anything?", "priorities": ["Having her words heard", "Participating in science", "Addressing peer behavior with chosen support"], "starter": "A private question to the science teacher before a selected classroom contribution", "adjustment": "the jaw effort, the teasing, and a smaller first step", "examples": ["After a negotiated baseline, Maya will ask a chosen science question in an agreed setting and record whether she conveyed her message and her effort rating.", "Maya will help choose and rehearse one response or support request for an identified school situation, then review its usefulness."], "sessions": ["Listen to Maya and caregiver perspectives, clarify what Maya wants shared, and gather contextual speech/impact information.", "Negotiate a teacher-supported first step; offer an effort-focused trial if Maya wants it and review her response."], "refs": ["M_ALLIANCE", "M_MOD", "M_TEEN", "C_ASSESS", "C_HIERARCHY"], "nodes": {"opening": {"id": "opening", "stage": "Starting with the client", "client": "Mom wants me to stop stuttering. I mostly want people to stop finishing my words. Do I have to do speech drills again?", "discussion": "What is the client asking for, and what would you need to learn before recommending a method?", "refs": ["M_ALLIANCE", "M_TEEN", "C_ASSESS"], "choices": [{"text": "Before choosing a method, could we understand what you want to be different and what you do not want from therapy?", "reply": "I want to ask my science question, but I am worried the same two students will laugh. My speech is easier here than in class.", "next": "explore", "feedback": "This response invites the client’s purpose before choosing a protocol. It begins an assessment conversation rather than assuming all goals are already known.", "stance": "explore", "agreement": null, "id": "A"}, {"text": "Could we begin with the speech pattern I usually teach, then return to your priorities after we see how fluently you can use it?", "reply": "I was hoping my reasons for coming would help decide what we do first.", "next": "repair", "feedback": "A speech trial can be useful, but this timing postpones the stated priority and risks turning a trial into an imposed starting point.", "stance": "revisit", "agreement": null, "id": "B"}]}, "repair": {"id": "repair", "stage": "Repairing the conversation", "client": "I do not feel that the plan starts with what I said. Can we slow down?", "discussion": "How could you acknowledge the mismatch without defending your expertise?", "refs": ["M_ALLIANCE", "M_TEEN", "C_ASSESS"], "choices": [{"text": "Would you be willing to complete my usual sequence first so we can decide later whether your priorities need a different approach?", "reply": "I do not want to commit to that sequence today.", "next": "pause", "feedback": "The client declines the proposed sequence. Respect that boundary and identify what can be offered or discussed without assuming treatment agreement.", "stance": "revisit", "agreement": null, "id": "A"}, {"text": "You are right that I moved too quickly. What feels most important for us to understand before deciding on a plan?", "reply": "I want to ask my science question, but I am worried the same two students will laugh. My speech is easier here than in class.", "next": "explo  step rather than assuming the client can follow it.", "stance": "revisit", "agreement": null, "id": "A"}, {"text": "Could we agree on a smaller or different arrangement that fits, then decide together at a review point whether to continue?", "reply": "That fits. I can try it without missing my responsibilities.", "next": "review", "feedback": "This negotiates feasibility rather than interpreting a barrier as noncompliance. The exact arrangement needs the client’s confirmation.", "stance": "explore", "agreement": "That fits. I can try it without missing my responsibilities.", "id": "B"}]}, "review": {"id": "review", "stage": "Interpreting a fictional follow-up", "client": "In this fictional follow-up, I asked my teacher a question twice and used less jaw effort. I still stuttered. The teasing also needs a school response.", "discussion": "What improved, what remains uncertain, and what would justify continuing, adapting, or reducing treatment?", "refs": ["M_EFFORT", "M_TRANSFER", "C_DISCHARGE"], "choices": [{"text": "Let us count the participation and effort changes, check the school response, and ask what step you want next.", "reply": "I want those parts of my experience included when we decide what to keep or change.", "next": "complete", "feedback": "Review the domains actually targeted, the client’s perspective, and evidence beyond the clinic. The hypothetical follow-up is authored teaching content, not a predicted treatment response.", "stance": "explore", "agreement": null, "id": "A"}, {"text": "Since stuttering is still audible, should we repeat the same tasks until the count drops before changing anything?", "reply": "That leaves out changes that mattered to me. Can we look at the whole experience?", "next": "review_repair", "feedback": "A speech count is one possible measure. It does not, by itself, settle effort, participation, agency, satisfaction, or maintenance.", "stance": "revisit", "agreement": null, "id": "B"}]}, "review_repair": {"id": "review_rep ld judge progress.", "task": "Identify the unresolved issue. Draft possible alternatives and the next conversation rather than describing the disputed part as an accepted treatment plan.", "choices": []}}, "start": "opening", "caseNumber": 1, "debrief": ["Which client statement changed your formulation?", "What would you still need to assess before finalizing treatment?", "Where did a response risk making fluent appearance the only outcome?", "What did your group negotiate rather than assume?", "Which response would you rewrite beyond the two provided options?"]}, {"id": "theo", "name": "Theo", "age": 17, "pronouns": "he/him", "gender": "Boy", "role": "High-school student and theater technician", "setting": "Suburban school", "resources": "Family can afford private services and transport. Theo has rehearsals and a part-time weekend job; time and privacy matter more than travel cost.", "focus": "Therapy fatigue, spontaneity, and choice about disclosure", "vignette": "Theo has persistent childhood-onset stuttering and has completed several structured treatment programs. He can demonstrate a prolonged speech pattern on request but often avoids radio communication backstage. His parents favor another intensive program. He wants to run the technical crew and sound like himself. He does not want a public announcement about stuttering.", "findings": ["Speech during drills is easier than during unpredictable crew exchanges.", "Theo describes constant monitoring as tiring.", "He values technical competence and already leads equipment setup."], "unknowns": ["Which previous treatment experiences Theo found helpful or unhelpful", "Effort, avoidance, and communication demands during crew exchanges", "Whether he wants individual work, peer practice, a pause, or another format"], "opening": "I already know the speech rules. I am tired of feeling watched. Can this be about crew calls instead of another program?", "priority": "I can do the pattern here, but I lose track of the message when I monitor every sound on the radio.", "motor": "I want the option of easing a stuck word. I do not want to stretch every sentence.", "motorOptions": ["Could we compare an optional response to a disruption with your usual crew call and discuss effort and message focus?", "Could we make continuous use of the prolonged pattern the goal because you have already mastered it in drills?"], "motorReactions": ["An option I can choose is different. I want to test it on a short cue.", "That is exactly what I said was exhausting."], "motorReason": "The chapter separates fluency from spontaneity. A successful clinic demonstration does not settle the acceptable monitoring demand in real communication.", "meaning": "I might practice with one crew friend. I do not want a class speech about my stuttering.", "meaningOptions": ["Would rehearsing a chosen crew exchange with that friend be a useful first step, with disclosure remaining your decision?", "Would an announcement to the whole crew be more efficient than discussing whether disclosure fits your goals?"], "meaningReactions": ["One friend and one real cue sounds useful.", "I do not agree to an announcement. I want to make that choice."], "meaningReason": "A manageable hierarchy and chosen support fit Theo’s stated readiness. Disclosure is an option, not a condition for participating or receiving help.", "goalQuote": "I want to call the lighting cue when it is my turn, even if the cue includes a stutter.", "goalGood": "Could we target a chosen crew call and track completion, message accuracy, effort, and your willingness to do the next one?", "goalOther": "Could we target fluent scripted reading first and use that result as our main measure of readiness for crew leadership?", "goalReply": "Yes. One short cue during rehearsal is where I want to start.", "goalPushback": "Reading here does not tell you whether I can run a cue with the crew.", "practiceQuote": "My only predictable opening is a short period before rehearsal. I want to keep weekends for work and friends.", "feasible": "Shall we fit a brief rehearsal into that existing period and let you choose whether to involve your friend?", "burden": "Shall we add a daily hour of clinic-style drills and a weekend group to show commitment?", "feasibleReply": "I can try that without giving up everything else.", "burdenReply": "I am not agreeing to another schedule that takes over my week.", "review": "In this fictional follow-up, I called my cue without substituting words. It had a few repetitions, but I paid attention to the crew rather than every sound.", "reviewGood": "Let us examine the message, reduced avoidance, and spontaneity, then decide together whether the speech option helped.", "reviewOther": "Shall we call this unsuccessful because the cue still contained repetitions?", "priorities": ["Meaningful crew leadership", "Less exhausting monitoring", "Choice about disclosure"], "starter": "One short lighting cue with a trusted crew member", "adjustment": "an optional response and less monitoring burden", "examples": ["After baseline sampling, Theo will deliver a self-selected rehearsal cue and evaluate message completion, effort, and attention to the interaction.", "Theo will compare speaking with and without a chosen speech response in an agreed rehearsal task and identify when he prefers each option."], "sessions": ["Explore prior therapy experiences and Theo’s own readiness, using a real crew task to identify demands.", "Compare optional responses in a short simulation and negotiate one rehearsal-based practice opportunity."], "refs": ["M_EFFORT", "M_CHOICE", "M_DISCLOSURE", "M_TEEN", "C_HIERARCHY"], "nodes": {"opening": {"id": "opening", "stage": "Starting with the client", "client": "I already know the speech rules. I am tired of feeling watched. Can this be about crew calls instead of another program?", "discussion": "What is the client asking for, and what would you need to learn before recommending a method?", "refs": ["M_ALLIANCE", "M_TEEN", "C_ASSESS"], "choices": [{"text": "Could we begin with the speech pattern I usually teach, then return to your priorities after we see how fluently you can use it?", "reply": "I was hoping my reasons for coming would help decide what we do first.", "next": "repair", "feedback": "A speech trial can be useful, but this timing postpones the stated priority and risks turning a trial into an imposed starting point.", "stance": "revisit", "agreement": null, "id": "A"}, {"text": "Before choosing a method, could we understand what you want to be different and what you do not want from therapy?", "reply": "I can do the pattern here, but I lose track of the message when I monitor every sound on the radio.", "next": "explore", "feedback": "This response invites the client’s purpose before choosing a protocol. It begins an assessment conversation rather than assuming all goals are already known.", "stance": "explore", "agreement": null, "id": "B"}]}, "repair": {"id": "repair", "stage": "Repairing the conversation", "client": "I do not feel that the plan starts with what I said. Can we slow down?", "discussion": "How could you acknowledge the mismatch without defending your expertise?", "refs": ["M_ALLIANCE", "M_TEEN", "C_ASSESS"], "choices": [{"text": "You are right that I moved too quickly. What feels most important for us to understand before deciding on a plan?", "reply": "I can do the pattern here, but I lose track of the message when I monitor every sound on the radio.", "next": "explore", "feedback": "Acknowledging a mismatch can restore collaboration. The following branch returns to exploration; agreement still has to be earned.", "stance": "explore", "agreement": null, "id": "A"}, {"text": "Would you be willing to complete my usual sequence first so we can decide later whether your priorities need a different approach?", "reply": "I do not want to commit to that sequence today.", "next": "pause", "feedback": "The client declines the proposed sequence. Respect that boundary and identify what can be offered or discussed without assuming treatment agreement.", "stance": "revisit", "agreement": null, "id": "B"}]}, "explore": {"id": "explore", "stage": "Choosing the next assessment focus", "client": "I can do the pattern here, but I lose track of the message when I monitor every sound on the radio.", "discussion": "Both choices can be useful. Explain what your first choice would reveal and what it would leave unanswered.", "refs": ["C_ASSESS"], "choices": [{"text": "Could we first explore the situation you want to enter, your expectations, and the support or changes that might matter?", "reply": "I might practice with one crew friend. I do not want a class speech about my stuttering.", "next": "meaning", "feedback": "Exploring participation and meaning can clarify the plan. Relevant speech behavior still needs attention when the client wants it. Both assessment routes are defensible starting points.", "stance": "tradeoff", "agreement": null, "id": "A"}, {"text": "Could we explore the physical speaking experience in a task you choose, including effort and what any response would cost you?", "reply": "I want the option of easing a stuck word. I do not want to stretch every sentence.", "next": "motor", "feedback": "A contextual speech trial can be informative. It does not replace the client’s account of participation or reactions. This branch prioritizes speech exploration, not a universal best approach.", "stance": "tradeoff", "agreement": null, "id": "B"}]}, "motor": {"id": "motor", "stage": "Exploring a speech option", "client": "I want the option of easing a stuck word. I do not want to stretch every sentence.", "discussion": "What would you explain and measure before deciding this trial belongs in a treatment plan?", "refs": ["M_EFFORT", "M_CHOICE"], "choices": [{"text": "Could we compare an optional response to a disruption with your usual crew call and discuss effort and message focus?", "reply": "An option I can choose is different. I want to test it on a short cue.", "next": "goal", "feedback": "The chapter separates fluency from spontaneity. A successful clinic demonstration does not settle the acceptable monitoring demand in real communication.", "stance": "explore", "agreement": null, "id": "A"}, {"text": "Could we make continuous use of the prolonged pattern the goal because you have already mastered it in drills?", "reply": "That is exactly what I said was exhausting.", "next": "adjust", "feedback": "The chapter separates fluency from spontaneity. A successful clinic demonstration does not settle the acceptable monitoring demand in real communication. Revisit the assumption exposed by the client’s response.", "stance": "revisit", "agreement": null, "id": "B"}]}, "meaning": {"id": "meaning", "stage": "Exploring meaning and participation", "client": "I might practice with one crew friend. I do not want a class speech about my stuttering.", "discussion": "What is the person’s meaning, and what makes the proposed next step voluntary and manageable?", "refs": ["M_DISCLOSURE", "M_TEEN", "C_HIERARCHY"], "choices": [{"text": "Would an announcement to the whole crew be more efficient than discussing whether disclosure fits your goals?", "reply": "I do not agree to an announcement. I want to make that choice.", "next": "adjust", "feedback": "A manageable hierarchy and chosen support fit Theo’s stated readiness. Disclosure is an option, not a condition for participating or receiving help. The client’s reply indicates that this version does not fit.", "stance": "revisit", "agreement": null, "id": "A"}, {"text": "Would rehearsing a chosen crew exchange with that friend be a useful first step, with disclosure remaining your decision?", "reply": "One friend and one real cue sounds useful.", "next": "goal", "feedback": "A manageable hierarchy and chosen support fit Theo’s stated readiness. Disclosure is an option, not a condition for participating or receiving help.", "stance": "explore", "agreement": null, "id": "B"}]}, "adjust": {"id": "adjust", "stage": "Revising a mismatch", "client": "I need us to come back to an optional response and less monitoring burden.", "discussion": "What would actually change after the client’s feedback?", "refs": ["M_ALLIANCE", "M_CHOICE"], "choices": [{"text": "Could we name the mismatch, offer a smaller comparison or conversation, and let you decide whether it is worth trying?", "reply": "I want to call the lighting cue when it is my turn, even if the cue includes a stutter.", "next": "goal", "feedback": "The plan changes because of client information. Describe the specific change rather than simply repeating the original recommendation.", "stance": "explore", "agreement": null, "id": "A"}, {"text": "Could we continue the same task until it feels easier and revisit the concern after the planned sequence?", "reply": "I would rather pause than continue that version today.", "next": "pause", "feedback": "Persisting with a mismatched task has not produced agreement in this script. A pause requires a readiness or assessment plan rather than an assumed technique prescription.", "stance": "revisit", "agreement": null, "id": "B"}]}, "goal": {"id": "goal", "stage": "Negotiating goals", "client": "I want to call the lighting cue when it is my turn, even if the cue includes a stutter.", "discussion": "Draft the goal in the client’s terms. What would make it observable without making fluent appearance the only outcome?", "refs": ["M_ALLIANCE", "M_EFFORT", "C_HIERARCHY"], "choices": [{"text": "Could we target fluent scripted reading first and use that result as our main measure of readiness for crew leadership?", "reply": "Reading here does not tell you whether I can run a cue with the crew.", "next": "goal_repair", "feedback": "A measurable target can still be poorly matched to the person’s purpose. Revise its domain, context, sequence, or meaning before treating it as shared.", "stance": "revisit", "agreement": null, "id": "A"}, {"text": "Could we target a chosen crew call and track completion, message accuracy, effort, and your willingness to do the next one?", "reply": "Yes. One short cue during rehearsal is where I want to start.", "next": "practice", "feedback": "This is agreement to a starting focus, not approval of every future activity or typed goal. Establish a baseline and negotiate specific criteria and review points.", "stance": "explore", "agreement": "Yes. One short cue during rehearsal is where I want to start.", "id": "B"}]}, "goal_repair": {"id": "goal_repair", "stage": "Revising the proposed goal", "client": "That goal is not quite what I asked for. What part can we change?", "discussion": "Which element of the goal did the client decline?", "refs": ["M_ALLIANCE", "M_COGNITION"], "choices": [{"text": "Let us rewrite the goal around the situation and change you chose. We can agree on measures and a review point after a baseline.", "reply": "Yes. One short cue during rehearsal is where I want to start.", "next": "practice", "feedback": "Revision gives the client an active role in defining success. Exact targets remain provisional until discussed.", "stance": "explore", "agreement": "Yes. One short cue during rehearsal is where I want to start.", "id": "A"}, {"text": "Could we keep my target as the main goal and treat your preferred outcome as a possible later benefit?", "reply": "I have not agreed to that goal.", "next": "provisional", "feedback": "The proposed goal remains unshared. Your written plan should identify the disagreement and a next conversation, not present the target as accepted.", "stance": "revisit", "agreement": null, "id": "B"}]}, "practice": {"id": "practice", "stage": "Planning feasible practice", "client": "My only predictable opening is a short period before rehearsal. I want to keep weekends for work and friends.", "discussion": "What resources are actually available? Avoid inferring motivation from money, schedule, age, or occupation.", "refs": ["M_TRANSFER", "M_ALLIANCE"], "choices": [{"text": "Shall we add a daily hour of clinic-style drills and a weekend group to show commitment?", "reply": "I am not agreeing to another schedule that takes over my week.", "next": "access", "feedback": "An ambitious plan is not automatically an accessible plan. The client’s actual constraint needs a change in format, dose, support, or timing.", "stance": "revisit", "agreement": null, "id": "A"}, {"text": "Shall we fit a brief rehearsal into that existing period and let you choose whether to involve your friend?", "reply": "I can try that without giving up everything else.", "next": "review", "feedback": "Practice must fit the stated access conditions and the client’s choices. Explain the first task and how the client can change it.", "stance": "explore", "agreement": "I can try that without giving up everything else.", "id": "B"}]}, "access": {"id": "access", "stage": "Renegotiating the arrangement", "client": "I can consider one short lighting cue with a trusted crew member. I cannot commit to the arrangement we just discussed.", "discussion": "How could you keep the clinical purpose while changing the arrangement?", "refs": ["M_ALLIANCE", "M_TRANSFER"], "choices": [{"text": "Could we agree on a smaller or different arrangement that fits, then decide together at a review point whether to continue?", "reply": "I can try that without giving up everything else.", "next": "review", "feedback": "This negotiates feasibility rather than interpreting a barrier as noncompliance. The exact arrangement needs the client’s confirmation.", "stance": "explore", "agreement": "I can try that without giving up everything else.", "id": "A"}, {"text": "Could we retain the original schedule as a test of readiness before considering a different arrangement?", "reply": "That still does not fit what I can agree to.", "next": "provisional", "feedback": "The arrangement remains unagreed. Document the barrier and another invitation or assessment step rather than assuming the client can follow it.", "stance": "revisit", "agreement": null, "id": "B"}]}, "review": {"id": "review", "stage": "Interpreting a fictional follow-up", "client": "In this fictional follow-up, I called my cue without substituting words. It had a few repetitions, but I paid attention to the crew rather than every sound.", "discussion": "What improved, what remains uncertain, and what would justify continuing, adapting, or reducing treatment?", "refs": ["M_EFFORT", "M_TRANSFER", "C_DISCHARGE"], "choices": [{"text": "Shall we call this unsuccessful because the cue still contained repetitions?", "reply": "That leaves out changes that mattered to me. Can we look at the whole experience?", "next": "review_repair", "feedback": "A speech count is one possible measure. It does not, by itself, settle effort, participation, agency, satisfaction, or maintenance.", "stance": "revisit", "agreement": null, "id": "A"}, {"text": "Let us examine the message, reduced avoidance, and spontaneity, then decide together whether the speech option helped.", "reply": "I want those parts of my experience included when we decide what to keep or change.", "next": "complete", "feedback": "Review the domains actually targeted, the client’s perspective, and evidence beyond the clinic. The hypothetical follow-up is authored teaching content, not a predicted treatment response.", "stance": "explore", "agreement": null, "id": "B"}]}, "review_repair": {"id": "review_repair", "stage": "Broadening the review", "client": "I need you to include the message, the effort, and whether I could do what I wanted.", "discussion": "Which measures answer this client’s goals, and which do not?", "refs": ["M_EFFORT", "M_ALLIANCE"], "choices": [{"text": "Let us review those outcomes together with any speech measures and decide which next step is useful to you.", "reply": "That is the kind of review I wanted.", "next": "complete", "feedback": "This broadens the outcome discussion without ignoring speech. The group still needs to specify how the chosen domains will be measured.", "stance": "explore", "agreement": null, "id": "A"}, {"text": "Could we keep the speech count as the deciding outcome and defer the other information?", "reply": "That would leave our plan only partly agreed.", "next": "provisional", "feedback": "The outcome criteria remain mismatched. The group should state the unresolved issue and how it would reopen the conversation.", "stance": "revisit", "agreement": null, "id": "B"}]}, "complete": {"id": "complete", "terminal": true, "title": "A starting focus is shared", "client": "The focus fits. I want to review the specific goals, practice tasks, and check-in arrangements before we finalize them.", "task": "Draft a provisional collaborative plan. Agreement in the script concerns the starting focus, not automatic approval of your written targets.", "choices": []}, "pause": {"id": "pause", "terminal": true, "title": "The client chooses to pause", "client": "I do not want to continue this version today. I may want to discuss different options later.", "task": "Respect the pause. Identify the mismatch, what is known and unknown, and an invitation or assessment plan that does not assume consent to a treatment sequence.", "choices": []}, "provisional": {"id": "provisional", "terminal": true, "title": "Part of the plan remains unshared", "client": "Some of this could be useful, but I have not agreed to the goal, arrangement, or way we would judge progress.", "task": "Identify the unresolved issue. Draft possible alternatives and the next conversation rather than describing the disputed part as an accepted treatment plan.", "choices": []}}, "start": "opening", "caseNumber": 2, "debrief": ["Which client statement changed your formulation?", "What would you still need to assess before finalizing treatment?", "Where did a response risk making fluent appearance the only outcome?", "What did your group negotiate rather than assume?", "Which response would you rewrite beyond the two provided options?"]}, {"id": "rowan", "name": "Rowan", "age": 19, "pronouns": "they/them", "gender": "Nonbinary person", "role": "First-year college student and grocery cashier", "setting": "Urban commuter college", "resources": "Limited income, a shared laptop, and variable work shifts. Campus services are available, but a weekly evening group overlaps with work.", "focus": "Covert avoidance, self-concept, and contextual assessment", "vignette": "Rowan has stuttered since childhood. Their speech sounds mostly fluent during a short interview because they substitute words and decline some speaking opportunities. They avoid introducing themself in seminars and have selected courses partly to avoid presentations. They want to contribute ideas in class without feeling that their participation must wait for perfectly fluent speech.", "findings": ["Low audible disfluency in the interview coexists with reported word substitution.", "Rowan says introductions require more effort than relaxed conversations.", "They have a classmate they trust and are curious about meeting other people who stutter."], "unknowns": ["The extent and function of substitutions and avoided opportunities", "Rowan’s account of identity, effort, and listener expectations", "Accessible support formats that fit their work schedule"], "opening": "People say I hardly stutter. They do not hear all the words I change or the times I stay quiet.", "priority": "I want to introduce myself with the words I actually choose. A low count here would miss the problem.", "motor": "A technique could help with effort, but I am worried I will use it as another way to hide.", "motorOptions": ["Could we identify a speaking response you want to explore and check whether it increases choice or becomes another rule for hiding?", "Could we use your low clinic disfluency count to decide that speech-related work is probably unnecessary?"], "motorReactions": ["I would like to notice the difference between choosing a response and feeling forced to use it.", "The count does not show how hard I work to sound fluent."], "motorReason": "Observable fluency can coexist with avoidance and effort. A trial should be interpreted through the person’s experience and goals, not the count alone.", "meaning": "I think everyone will remember me as the student who stutters. I have never tested that prediction with someone I trust.", "meaningOptions": ["Would you like to predict what may happen in a small introduction, try it with your classmate, and compare the actual experience?", "Could we reassure you that nobody will react negatively and move straight to a whole-class introduction?"], "meaningReactions": ["I can test a smaller situation without pretending that every listener will be ideal.", "You cannot know how everyone will react, and that is too big a step."], "meaningReason": "A behavioral experiment explores predictions without guaranteeing listener reactions. The first task follows the speaker’s readiness.", "goalQuote": "Could a goal be using my own name and one idea, even if I stutter?", "goalGood": "Shall we negotiate a first introduction and measure chosen words, participation, and effort rather than only audible fluency?", "goalOther": "Shall we first require a lower stuttering count before attempting an introduction outside therapy?", "goalReply": "Yes. I want to start with my classmate before deciding about the seminar.", "goalPushback": "I already use a low count to hide. I need a goal that lets me participate.", "practiceQuote": "My shifts change. I cannot promise the same evening every week, but I can use a few minutes before class.", "feasible": "Could we plan brief practice before class and explore a support option with flexible attendance, if you want one?", "burden": "Could you change your work schedule to attend the fixed evening group as the main requirement?", "feasibleReply": "That fits my week and leaves me some choice about a group.", "burdenReply": "I cannot risk losing shifts. Please do not mistake that for unwillingness.", "review": "In this fictional follow-up, I used my own name and contributed an idea. There was more audible stuttering than in our interview, but less substitution.", "reviewGood": "Let us examine the reduced substitution and participation alongside effort and your experience of the stuttering.", "reviewOther": "Should we classify this as deterioration because the audible count increased?", "priorities": ["Using chosen words", "Entering seminars", "Finding support that fits work"], "starter": "An introduction to a trusted classmate before a seminar contribution", "adjustment": "hidden avoidance and a smaller introduction experiment", "examples": ["Rowan will attempt a collaboratively selected introduction using their chosen words and record substitutions, message completion, and effort.", "Rowan will compare one prediction about an introduction with the actual outcome and identify an alternative interpretation they find credible."], "sessions": ["Gather narrative and contextual speech information about substitutions, effort, and avoided participation.", "Co-design an introduction experiment and, if desired, compare an effort-focused speech option without making fluency a prerequisite."], "refs": ["M_EFFORT", "M_CHOICE", "M_COGNITION", "M_GROUPS", "C_ASSESS"], "nodes": {"opening": {"id": "opening", "stage": "Starting with the client", "client": "People say I hardly stutter. They do not hear all the words I change or the times I stay quiet.", "discussion": "What is the client asking for, and what would you need to learn before recommending a method?", "refs": ["M_ALLIANCE"], "choices": [{"text": "Before choosing a method, could we understand what you want to be different and what you do not want from therapy?", "reply": "I want to introduce myself with the words I actually choose. A low count here would miss the problem.", "next": "explore", "feedback": "This response invites the client’s purpose before choosing a protocol. It begins an assessment conversation rather than assuming all goals are already known.", "stance": "explore", "agreement": null, "id": "A"}, {"text": "Could we begin with the speech pattern I usually teach, then return to your priorities after we see how fluently you can use it?", "reply": "I was hoping my reasons for coming would help decide what we do first.", "next": "repair", "feedback": "A speech trial can be useful, but this timing postpones the stated priority and risks turning a trial into an imposed starting point.", "stance": "revisit", "agreement": null, "id": "B"}]}, "repair": {"id": "repair", "stage": "Repairing the conversation", "client": "I do not feel that the plan starts with what I said. Can we slow down?", "discussion": "How could you acknowledge the mismatch without defending your expertise?", "refs": ["M_ALLIANCE"], "choices": [{"text": "Would you be willing to complete my usual sequence first so we can decide later whether your priorities need a different approach?", "reply": "I do not want to commit to that sequence today.", "next": "pause", "feedback": "The client declines the proposed sequence. Respect that boundary and identify what can be offered or discussed without assuming treatment agreement.", "stance": "revisit", "agreement": null, "id": "A"}, {"text": "You are right that I moved too quickly. What feels most important for us to understand before deciding on a plan?", "reply": "I want to introduce myself with the words I actually choose. A low count here would miss the problem.", "next": "explore", "feedback": "Acknowledging a mismatch can restore collaboration. The following branch returns to exploration; agreement still has to be earned.", "stance": "explore", "agreement": null, "id": "B"}]}, "explore": {"id": "explore", "stage": "Choosing the next assessment focus", "client": "I want to introduce myself with the words I actually choose. A low count here would miss the problem.", "discussio ent": null, "id": "A"}, {"text": "Could we identify a speaking response you want to explore and check whether it increases choice or becomes another rule for hiding?", "reply": "I would like to notice the difference between choosing a response and feeling forced to use it.", "next": "goal", "feedback": "Observable fluency can coexist with avoidance and effort. A trial should be interpreted through the person’s experience and goals, not the count alone.", "stance": "explore", "agreement": null, "id": "B"}]}, "meaning": {"id": "meaning", "stage": "Exploring meaning and participation", "client": "I think everyone will remember me as the student who stutters. I have never tested that prediction with someone I trust.", "discussion": "What is the person’s meaning, and what makes the proposed next step voluntary and manageable?", "refs": ["M_COGNITION", "M_GROUPS"], "choices": [{"text": "Would you like to predict what may happen in a small introduction, try it with your classmate, and compare the actual experience?", "reply": "I can test a smaller situation without pretending that every listener will be ideal.", "next": "goal", "feedback": "A behavioral experiment explores predictions without guaranteeing listener reactions. The first task follows the speaker’s readiness.", "stance": "explore", "agreement": null, "id": "A"}, {"text": "Could we reassure you that nobody will react negatively and move straight to a whole-class introduction?", "reply": "You cannot know how everyone will react, and that is too big a step.", "next": "adjust", "feedback": "A behavioral experiment explores predictions without guaranteeing listener reactions. The first task follows the speaker’s readiness. The client’s reply indicates that this version does not fit.", "stance": "revisit", "agreement": null, "id": "B"}]}, "adjust": {"id": "adjust", "stage": "Revising a mismatch", "client": "I need us to come back to hidden avoidance and a smaller introduction experiment.", "discussion": "What would hat lets me participate.", "next": "goal_repair", "feedback": "A measurable target can still be poorly matched to the person’s purpose. Revise its domain, context, sequence, or meaning before treating it as shared.", "stance": "revisit", "agreement": null, "id": "B"}]}, "goal_repair": {"id": "goal_repair", "stage": "Revising the proposed goal", "client": "That goal is not quite what I asked for. What part can we change?", "discussion": "Which element of the goal did the client decline?", "refs": ["M_ALLIANCE", "M_COGNITION"], "choices": [{"text": "Could we keep my target as the main goal and treat your preferred outcome as a possible later benefit?", "reply": "I have not agreed to that goal.", "next": "provisional", "feedback": "The proposed goal remains unshared. Your written plan should identify the disagreement and a next conversation, not present the target as accepted.", "stance": "revisit", "agreement": null, "id": "A"}, {"text": "Let us rewrite the goal around the situation and change you chose. We can agree on measures and a review point after a baseline.", "reply": "Yes. I want to start with my classmate before deciding about the seminar.", "next": "practice", "feedback": "Revision gives the client an active role in defining success. Exact targets remain provisional until discussed.", "stance": "explore", "agreement": "Yes. I want to start with my classmate before deciding about the seminar.", "id": "B"}]}, "practice": {"id": "practice", "stage": "Planning feasible practice", "client": "My shifts change. I cannot promise the same evening every week, but I can use a few minutes before class.", "discussion": "What resources are actually available? Avoid inferring motivation from money, schedule, age, or occupation.", "refs": ["M_TRANSFER", "M_ALLIANCE"], "choices": [{"text": "Could we plan brief practice before class and explore a support option with flexible attendance, if you want one?", "reply": "That fits my week and leaves me some choice about a group.", "next": "review", "feedback": "Practice must fit the stated access conditions and the client’s choices. Explain the first task and how the client can change it.", "stance": "explore", "agreement": "That fits my week and leaves me some choice about a group.", "id": "A"}, {"text": "Could you change your work schedule to attend the fixed evening group as the main requirement?", "reply": "I cannot risk losing shifts. Please do not mistake that for unwillingness.", "next": "access", "feedback": "An ambitious plan is not automatically an accessible plan. The client’s actual constraint needs a change in format, dose, support, or timing.", "stance": "revisit", "agreement": null, "id": "B"}]}, "access": {"id": "access", "stage": "Renegotiating the arrangement", "client": "I can consider an introduction to a trusted classmate before a seminar contribution. I cannot commit to the arrangement we just discussed.", "discussion": "How could you keep the clinical purpose while changing the arrangement?", "refs": ["M_ALLIANCE", "M_TRANSFER"], "choices": [{"text": "Could we retain the original schedule as a test of readiness before considering a different arrangement?", "reply": "That still does not fit what I can agree to.", "next": "provisional", "feedback": "The arrangement remains unagreed. Document the barrier and another invitation or assessment step rather than assuming the client can follow it.", "stance": "revisit", "agreement": null, "id": "A"}, {"text": "Could we agree on a smaller or different arrangement that fits, then decide together at a review point whether to continue?", "reply": "That fits my week and leaves me some choice about a group.", "next": "review", "feedback": "This negotiates feasibility rather than interpreting a barrier as noncompliance. The exact arrangement needs the client’s confirmation.", "stance": "explore", "agreement": "That fits my week and leaves me some choice about a group.", "id": "B"}]}, "review": {"id": "review", "stage": "Interpreting a fictional follow-up", "client": "In this fictional follow-up, I used my own name and contributed an idea. There was more audible stuttering than in our interview, but less substitution.", "discussion": "What improved, what remains uncertain, and what would justify continuing, adapting, or reducing treatment?", "refs": ["M_EFFORT", "M_TRANSFER"], "choices": [{"text": "Let us examine the reduced substitution and participation alongside effort and your experience of the stuttering.", "reply": "I want those parts of my experience included when we decide what to keep or change.", "next": "complete", "feedback": "Review the domains actually targeted, the client’s perspective, and evidence beyond the clinic. The hypothetical follow-up is authored teaching content, not a predicted treatment response.", "stance": "explore", "agreement": null, "id": "A"}, {"text": "Should we classify this as deterioration because the audible count increased?", "reply": "That leaves out changes that mattered to me. Can we look at the whole experience?", "next": "review_repair", "feedback": "A speech count is one possible measure. It does not, by itself, settle effort, participation, agency, satisfaction, or maintenance.", "stance": "revisit", "agreement": null, "id": "B"}]}, "review_repair": {"id": "review_repair", "stage": "Broadening the review", "client": "I need you to include the message, the effort, and whether I could do what I wanted.", "discussion": "Which measures answer this client’s goals, and which do not?", "refs": ["M_EFFORT", "M_ALLIANCE"], "choices": [{"text": "Could we keep the speech count as the deciding outcome and defer the other information?", "reply": "That would leave our plan only partly agreed.", "next": "provisional", "feedback": "The outcome criteria remain mismatched. The group should state the unresolved issue and how it would reopen the conversation.", "stance": "revisit", "agreement": null, "id": "A"}, {"text": "Let us review those outcomes together with any s gional design firm", "resources": "Salaried employment and substantial student debt. He can attend a regular appointment but cannot afford a long period away from work.", "focus": "Trial therapy, motor learning, and useful transfer", "vignette": "Amir has persistent childhood-onset stuttering and wants help with effort during project updates. He does not generally avoid talking or feel ashamed of stuttering. A prior clinician selected all of his targets. He wants to compare options and understand what each one is meant to do. He has a supportive coworker and a project presentation next month.", "findings": ["Amir reports blocks with marked articulatory effort during some updates.", "He participates regularly and has a positive view of himself as a communicator.", "Prolonged speech in a previous session felt unnatural; a lighter contact trial has not been explored."], "unknowns": ["Amir’s response to different speech-production trials", "Effort and naturalness across unscripted project exchanges", "What level of monitoring he finds acceptable"], "opening": "I am comfortable being a person who stutters. I want less effort in project updates, and I want a say in which tools we try.", "priority": "I do not need you to talk me into speaking. I would like to compare what actually makes an update easier.", "motor": "Slowing everything down changed my style. Could we try something more specific and compare the result?", "motorOptions": ["Could we compare a limited speech-production target with your usual pattern and ask about effort, naturalness, and usefulness?", "Could we keep the original prolonged pattern until it sounds fluent enough, then discuss whether it feels acceptable?"], "motorReactions": ["A comparison with my own feedback is what I wanted.", "I want my judgment to matter during the trial, not only after I meet a fluency target."], "motorReason": "The chapter supports trial therapy and adapting targets to the speaker. A positive communicator self-view and limi dback": "An ambitious plan is not automatically an accessible plan. The client’s actual constraint needs a change in format, dose, support, or timing.", "stance": "revisit", "agreement": null, "id": "A"}, {"text": "Could we use that coworker task and short agreed practice periods, then review whether this format is helping?", "reply": "That is an option I can realistically try.", "next": "review", "feedback": "Practice must fit the stated access conditions and the client’s choices. Explain the first task and how the client can change it.", "stance": "explore", "agreement": "That is an option I can realistically try.", "id": "B"}]}, "access": {"id": "access", "stage": "Renegotiating the arrangement", "client": "I can consider a short update with a chosen coworker. I cannot commit to the arrangement we just discussed.", "discussion": "How could you keep the clinical purpose while changing the arrangement?", "refs": ["M_ALLIANCE", "M_TRANSFER"], "choices": [{"text": "Could we agree on a smaller or different arrangement that fits, then decide together at a review point whether to continue?", "reply": "That is an option I can realistically try.", "next": "review", "feedback": "This negotiates feasibility rather than interpreting a barrier as noncompliance. The exact arrangement needs the client’s confirmation.", "stance": "explore", "agreement": "That is an option I can realistically try.", "id": "A"}, {"text": "Could we retain the original schedule as a test of readiness before considering a different arrangement?", "reply": "That still does not fit what I can agree to.", "next": "provisional", "feedback": "The arrangement remains unagreed. Document the barrier and another invitation or assessment step rather than assuming the client can follow it.", "stance": "revisit", "agreement": null, "id": "B"}]}, "review": {"id": "review", "stage": "Interpreting a fictional follow-up", "client": "In this fictional follow-up, my update had some blocks, but I rated effort lower and greed.", "next": "provisional", "feedback": "The outcome criteria remain mismatched. The group should state the unresolved issue and how it would reopen the conversation.", "stance": "revisit", "agreement": null, "id": "B"}]}, "complete": {"id": "complete", "terminal": true, "title": "A starting focus is shared", "client": "The focus fits. I want to review the specific goals, practice tasks, and check-in arrangements before we finalize them.", "task": "Draft a provisional collaborative plan. Agreement in the script concerns the starting focus, not automatic approval of your written targets.", "choices": []}, "pause": {"id": "pause", "terminal": true, "title": "The client chooses to pause", "client": "I do not want to continue this version today. I may want to discuss different options later.", "task": "Respect the pause. Identify the mismatch, what is known and unknown, and an invitation or assessment plan that does not assume consent to a treatment sequence.", "choices": []}, "provisional": {"id": "provisional", "terminal": true, "title": "Part of the plan remains unshared", "client": "Some of this could be useful, but I have not agreed to the goal, arrangement, or way we would judge progress.", "task": "Identify the unresolved issue. Draft possible alternatives and the next conversation rather than describing the disputed part as an accepted treatment plan.", "choices": []}}, "start": "opening", "caseNumber": 4, "debrief": ["Which client statement changed your formulation?", "What would you still need to assess before finalizing treatment?", "Where did a response risk making fluent appearance the only outcome?", "What did your group negotiate rather than assume?", "Which response would you rewrite beyond the two provided options?"]}, {"id": "monique", "name": "Monique", "age": 33, "pronouns": "she/her", "gender": "Woman", "role": "Warehouse team lead", "setting": "Hourly shift work", "resources": "Variable income, no paid leave for appointments, and responsibility for school pickup. Her phone has limited data; paper notes work well for her.", "focus": "Feasible practice, responsibility, and environmental demands", "vignette": "Monique has stuttered since childhood and has recently begun avoiding supervisor phone calls. She can use a practiced response with the clinician but loses access to it under time pressure. She wants to discuss stalled words with less effort and contribute at shift meetings. She is concerned that a program will label her noncompliant if practice does not fit her week.", "findings": ["She reports useful clinic practice but little carryover to supervisor calls.", "Late shifts and pickup duties limit appointment times.", "She has identified one predictable weekly call she wants to handle herself."], "unknowns": ["The specific demands of calls and the moment she stops using the response", "The amount and format of practice she can choose and sustain", "Whether she wants any workplace support involved"], "opening": "I tried what we practiced. It worked here but not with my supervisor. I do not have an hour every night to drill it.", "priority": "The call gets rushed, and I either change the word or hand it to someone else. I want a plan that survives a workday.", "motor": "When I notice a block, I tense up trying to remember every instruction.", "motorOptions": ["Could we identify one manageable response to that moment and gradually test it under the demands of your chosen call?", "Could we add several simultaneous speech targets so you have more rules available under pressure?"], "motorReactions": ["One response and a gradual test sounds easier to learn from.", "More things to remember may be part of the problem."], "motorReason": "Stabilization requires practice under contextual demands. More explicit monitoring is not automatically more useful, and clinic performance alone does not show transfer.", "meaning": "I have been calling missed practice a personal failure, even when the schedule was impossible.", "meaningOptions": ["Could we separate what did not fit the schedule from what you chose, then design a small task you consider worth doing?", "Could we describe this as a motivation problem and use completion of a long practice log as the first goal?"], "meaningReactions": ["I can own a realistic task. I cannot promise a schedule I do not have.", "That would repeat the problem I am worried about."], "meaningReason": "Responsibility for action can coexist with realistic support and access. The chapter’s agency focus does not make environmental constraints evidence of poor motivation.", "goalQuote": "I want to handle one of my own supervisor calls and have less struggle when a word sticks.", "goalGood": "Shall we choose a call and measure completion, substitution or handoff, effort, and whether the response is useful?", "goalOther": "Shall we use perfect clinic use of all targets as the condition for attempting any supervisor call?", "goalReply": "Yes. I want to start with the short weekly scheduling call.", "goalPushback": "Waiting for perfect clinic performance keeps the call out of reach.", "practiceQuote": "A few minutes before the weekly call is possible. A data-heavy app and daily video uploads are not.", "feasible": "Could we rehearse that short call, use a paper check-in, and agree how much practice fits your week?", "burden": "Could we make daily video uploads the condition for continuing the program?", "feasibleReply": "I can try the call and bring brief notes to review.", "burdenReply": "I would lose access to the program even if I were practicing in ways that fit.", "review": "In this fictional follow-up, I completed two calls myself. My speech still varied, but I handed off less and knew one way to respond when I got stuck.", "reviewGood": "Let us examine the calls, effort, and reduced handoff, then adjust the next practice demand together.", "reviewOther": "Should we discount the calls because the speech sample still varies across situations?", "priorities": ["Handling her own calls", "Reducing effort", "A plan compatible with work and parenting"], "starter": "The weekly scheduling call after a brief rehearsal", "adjustment": "one workable response and a realistic practice schedule", "examples": ["Monique will attempt a self-selected supervisor call and record whether she completed the message, substituted words, or handed off the call, alongside effort.", "Monique will practice a chosen response in an agreed brief rehearsal and judge whether it remains useful as one call demand increases."], "sessions": ["Identify the gap between clinic use and calls and agree on a feasible method of tracking experience.", "Rehearse the selected call, increase one demand with agreement, and choose a real-world trial."], "refs": ["M_ALLIANCE", "M_EFFORT", "M_MOD", "M_TRANSFER"], "nodes": {"opening": {"id": "opening", "stage": "Starting with the client", "client": "I tried what we practiced. It worked here but not with my supervisor. I do not have an hour every night to drill it.", "discussion": "What is the client asking for, and what would you need to learn before recommending a method?", "refs": ["M_ALLIANCE"], "choices": [{"text": "Before choosing a method, could we understand what you want to be different and what you do not want from therapy?", "reply": "The call gets rushed, and I either change the word or hand it to someone else. I want a plan that survives a workday.", "next": "explore", "feedback": "This response invites the client’s purpose before choosing a protocol. It begins an assessment conversation rather than assuming all goals are already known.", "stance": "explore", "agreement": null, "id": "A"}, {"text": "Could we begin with the speech pattern I usually teach, then return to your priorities after we see how fluently you can use it?", "reply": "I was hoping my reasons for coming would help decide what we do first.", "next": "repair", "feedback": "A speech trial can be useful, but this timing postpones the stated priority and risks turning a trial into an imposed starting point.", "stance": "revisit", "agreement": null, "id": "B"}]}, "repair": {"id": "repair", "stage": "Repairing the conversation", "client": "I do not feel that the plan starts with what I said. Can we slow down?", "discussion": "How could you acknowledge the mismatch without defending your expertise?", "refs": ["M_ALLIANCE"], "choices": [{"text": "Would you be willing to complete my usual sequence first so we can decide later whether your priorities need a different approach?", "reply": "I do not want to commit to that sequence today.", "next": "pause", "feedback": "The client declines the proposed sequence. Respect that boundary and identify what can be offered or discussed without assuming treatment agreement.", "stance": "revisit", "agreement": null, "id": "A"}, {"text": "You are right that I moved too quickly. What feels most important for us to understand before deciding on a plan?", "reply": "The call gets rushed, and I either change the word or hand it to someone else. I want a plan that survives a workday.", "next": "explore", "feedback": "Acknowledging a mismatch can restore collaboration. The following branch returns to exploration; agreement still has to be earned.", "stance": "explore", "agreement": null, "id": "B"}]}, "explore": {"id": "explore", "stage": "Choosing the next assessment focus", "client": "The call gets rushed, and I either change the word or hand it to someone else. I want a plan that survives a workday.", "discussion": "Both choices can be useful. Explain what your first choice would reveal and what it would leave unanswered.", "refs": ["M_CHOICE", "M_EFFORT"], "choices": [{"text": "Could we explore the physical speaking experience in a task you choose, including effort and what any response would cost you?", "reply": "When I notice a block, I tense up trying to remember every instruction.", "next": "motor", "feedback": "A contextual speech trial can be informative. It does no  satisfaction in conversation.", "findings": ["The reported device effect comes from one reading demonstration.", "Networking and unscripted questions are more important to her than reading.", "She wants both less effort and more control over whether to use a tool."], "unknowns": ["Her experience with and without the device in meaningful tasks", "How fluency, effort, satisfaction, and participation relate for her", "Whether she prefers behavioral options, device exploration, or both"], "opening": "The demonstration sounded much smoother. Does that mean a device will solve this better than therapy?", "priority": "I care about unscripted meetings and calls, not reading a passage. I also do not want the device to distract me.", "motor": "I would like options, but I do not want someone to tell me that a lower count automatically means I should buy something.", "motorOptions": ["Could we compare tools in tasks you choose and include effort, distraction, and your judgment of usefulness?", "Could we treat the reading reduction as enough evidence to choose the device as your long-term solution?"], "motorReactions": ["That would help me make my own decision rather than follow a demonstration.", "That leaves out the situations I actually asked about."], "motorReason": "The chapter reports variability across people and tasks and a possible mismatch between measured fluency and satisfaction. A brief demonstration does not determine long-term value.", "meaning": "I think I will only be a credible professional if nobody hears a block.", "meaningOptions": ["Could we explore that prediction and test what credibility and communication look like in a chosen exchange?", "Could we promise complete fluency first so that the credibility question never needs to arise?"], "meaningReactions": ["I would like to test the prediction without pretending every listener is ideal.", "That sounds like a promise you may not be able to keep."], "meaningReason": "Cognitive restructuring can explore a speaker’s meanings through experience. Neither a device demonstration nor a fluency promise settles professional identity or listener behavior.", "goalQuote": "I want to choose a useful way to make networking calls and answer questions, with less effort.", "goalGood": "Shall we define useful change in a chosen call and compare participation, effort, satisfaction, and speech with each option?", "goalOther": "Shall we use reading fluency alone as the outcome that decides which tool you should use?", "goalReply": "Yes. I want my experience in the actual task to count.", "goalPushback": "Reading was the easy demonstration. It is not the outcome I need.", "practiceQuote": "I can schedule a comparison task. I do not want to involve clients in an experiment or assume that purchase is already decided.", "feasible": "Could we use a simulated networking call and a self-selected low-stakes conversation, with a review before any commitment?", "burden": "Could we require a purchase and immediate use in every professional exchange before discussing your experience?", "feasibleReply": "That preserves choice and gives us relevant information.", "burdenReply": "I am not agreeing to a purchase or to use it everywhere.", "review": "In this fictional follow-up, reading was smoother with the device, but I disliked the distraction in conversation. I preferred one optional behavioral response during a practice call.", "reviewGood": "Let us review these different outcomes and your preferences before deciding what, if anything, to continue.", "reviewOther": "Should we select the device solely because the reading count improved more?", "priorities": ["Useful professional conversations", "Informed choice about tools", "Lower effort without unwanted distraction"], "starter": "A simulated networking call with agreed comparisons", "adjustment": "real-world usefulness and choice rather than a demonstration result", "examples": ["Elena will compare selected options in agreed reading and conversational tasks using speech, effort, distraction, and satisfaction measures.", "Elena will complete a chosen networking exchange and identify which option, including no additional tool, best supports her message and participation."], "sessions": ["Clarify meaningful outcomes, review the limited demonstration, and obtain contextual baseline information.", "Offer an agreed comparison and review the tradeoffs without making purchase or fluency a condition for success."], "refs": ["M_DEVICES", "M_EFFORT", "M_CHOICE", "M_COGNITION"], "nodes": {"opening": {"id": "opening", "stage": "Starting with the client", "client": "The demonstration sounded much smoother. Does that mean a device will solve this better than therapy?", "discussion": "What is the client asking for, and what would you need to learn before recommending a method?", "refs": ["M_ALLIANCE"], "choices": [{"text": "Could we begin with the speech pattern I usually teach, then return to your priorities after we see how fluently you can use it?", "reply": "I was hoping my reasons for coming would help decide what we do first.", "next": "repair", "feedback": "A speech trial can be useful, but this timing postpones the stated priority and risks turning a trial into an imposed starting point.", "stance": "revisit", "agreement": null, "id": "A"}, {"text": "Before choosing a method, could we understand what you want to be different and what you do not want from therapy?", "reply": "I care about unscripted meetings and calls, not reading a passage. I also do not want the device to distract me.", "next": "explore", "feedback": "This response invites the client’s purpose before choosing a protocol. It begins an assessment conversation rather than assuming all goals are already known.", "stance": "explore", "agreement": null, "id": "B"}]}, "repair": {"id": "repair", "stage": "Repairing the conversation", "client": "I do not feel that the plan starts with what I said. Can we slow down?", "discussion": "How could you acknowledge : "I would like options, but I do not want someone to tell me that a lower count automatically means I should buy something.", "next": "motor", "feedback": "A contextual speech trial can be informative. It does not replace the client’s account of participation or reactions. This branch prioritizes speech exploration, not a universal best approach.", "stance": "tradeoff", "agreement": null, "id": "B"}]}, "motor": {"id": "motor", "stage": "Exploring a speech option", "client": "I would like options, but I do not want someone to tell me that a lower count automatically means I should buy something.", "discussion": "What would you explain and measure before deciding this trial belongs in a treatment plan?", "refs": ["M_DEVICES", "M_EFFORT", "M_CHOICE"], "choices": [{"text": "Could we compare tools in tasks you choose and include effort, distraction, and your judgment of usefulness?", "reply": "That would help me make my own decision rather than follow a demonstration.", "next": "goal", "feedback": "The chapter reports variability across people and tasks and a possible mismatch between measured fluency and satisfaction. A brief demonstration does not determine long-term value.", "stance": "explore", "agreement": null, "id": "A"}, {"text": "Could we treat the reading reduction as enough evidence to choose the device as your long-term solution?", "reply": "That leaves out the situations I actually asked about.", "next": "adjust", "feedback": "The chapter reports variability across people and tasks and a possible mismatch between measured fluency and satisfaction. A brief demonstration does not determine long-term value. Revisit the assumption exposed by the client’s response.", "stance": "revisit", "agreement": null, "id": "B"}]}, "meaning": {"id": "meaning", "stage": "Exploring meaning and participation", "client": "I think I will only be a credible professional if nobody hears a block.", "discussion": "What is the person’s meaning, and what makes the proposed next step voluntary and manageable?", "refs": ["M_COGNITION"], "choices": [{"text": "Could we promise complete fluency first so that the credibility question never needs to arise?", "reply": "That sounds like a promise you may not be able to keep.", "next": "adjust", "feedback": "Cognitive restructuring can explore a speaker’s meanings through experience. Neither a device demonstration nor a fluency promise settles professional identity or listener behavior. The client’s reply indicates that this version does not fit.", "stance": "revisit", "agreement": null, "id": "A"}, {"text": "Could we explore that prediction and test what credibility and communication look like in a chosen exchange?", "reply": "I would like to test the prediction without pretending every listener is ideal.", "next": "goal", "feedback": "Cognitive restructuring can explore a speaker’s meanings through experience. Neither a device demonstration nor a fluency promise settles professional identity or listener behavior.", "stance": "explore", "agreement": null, "id": "B"}]}, "adjust": {"id": "adjust", "stage": "Revising a mismatch", "client": "I need us to come back to real-world usefulness and choice rather than a demonstration result.", "discussion": "What would actually change after the client’s feedback?", "refs": ["M_ALLIANCE", "M_CHOICE"], "choices": [{"text": "Could we name the mismatch, offer a smaller comparison or conversation, and let you decide whether it is worth trying?", "reply": "I want to choose a useful way to make networking calls and answer questions, with less effort.", "next": "goal", "feedback": "The plan changes because of client information. Describe the specific change rather than simply repeating the original recommendation.", "stance": "explore", "agreement": null, "id": "A"}, {"text": "Could we continue the same task until it feels easier and revisit the concern after the planned sequence?", "reply": "I would rather pause than continue that version today.", "next": "pause", "feedba practice", "feedback": "Revision gives the client an active role in defining success. Exact targets remain provisional until discussed.", "stance": "explore", "agreement": "Yes. I want my experience in the actual task to count.", "id": "A"}, {"text": "Could we keep my target as the main goal and treat your preferred outcome as a possible later benefit?", "reply": "I have not agreed to that goal.", "next": "provisional", "feedback": "The proposed goal remains unshared. Your written plan should identify the disagreement and a next conversation, not present the target as accepted.", "stance": "revisit", "agreement": null, "id": "B"}]}, "practice": {"id": "practice", "stage": "Planning feasible practice", "client": "I can schedule a comparison task. I do not want to involve clients in an experiment or assume that purchase is already decided.", "discussion": "What resources are actually available? Avoid inferring motivation from money, schedule, age, or occupation.", "refs": ["M_TRANSFER", "M_ALLIANCE"], "choices": [{"text": "Could we require a purchase and immediate use in every professional exchange before discussing your experience?", "reply": "I am not agreeing to a purchase or to use it everywhere.", "next": "access", "feedback": "An ambitious plan is not automatically an accessible plan. The client’s actual constraint needs a change in format, dose, support, or timing.", "stance": "revisit", "agreement": null, "id": "A"}, {"text": "Could we use a simulated networking call and a self-selected low-stakes conversation, with a review before any commitment?", "reply": "That preserves choice and gives us relevant information.", "next": "review", "feedback": "Practice must fit the stated access conditions and the client’s choices. Explain the first task and how the client can change it.", "stance": "explore", "agreement": "That preserves choice and gives us relevant information.", "id": "B"}]}, "access": {"id": "access", "stage": "Renegotiating the arrangement", "client": "I can consider a simulated networking call with agreed comparisons. I cannot commit to the arrangement we just discussed.", "discussion": "How could you keep the clinical purpose while changing the arrangement?", "refs": ["M_ALLIANCE", "M_TRANSFER"], "choices": [{"text": "Could we agree on a smaller or different arrangement that fits, then decide together at a review point whether to continue?", "reply": "That preserves choice and gives us relevant information.", "next": "review", "feedback": "This negotiates feasibility rather than interpreting a barrier as noncompliance. The exact arrangement needs the client’s confirmation.", "stance": "explore", "agreement": "That preserves choice and gives us relevant information.", "id": "A"}, {"text": "Could we retain the original schedule as a test of readiness before considering a different arrangement?", "reply": "That still does not fit what I can agree to.", "next": "provisional", "feedback": "The arrangement remains unagreed. Document the barrier and another invitation or assessment step rather than assuming the client can follow it.", "stance": "revisit", "agreement": null, "id": "B"}]}, "review": {"id": "review", "stage": "Interpreting a fictional follow-up", "client": "In this fictional follow-up, reading was smoother with the device, but I disliked the distraction in conversation. I preferred one optional behavioral response during a practice call.", "discussion": "What improved, what remains uncertain, and what would justify continuing, adapting, or reducing treatment?", "refs": ["M_EFFORT", "M_TRANSFER"], "choices": [{"text": "Should we select the device solely because the reading count improved more?", "reply": "That leaves out changes that mattered to me. Can we look at the whole experience?", "next": "review_repair", "feedback": "A speech count is one possible measure. It does not, by itself, settle effort, participation, agency, satisfaction, or maintenance.", "stance": "revisit", "agreement": null, "id": "A .", "Dev describes physical effort rather than a wish to sound fluent.", "They dislike instructions to monitor every sentence while listening to clients."], "unknowns": ["The particular speech behaviors associated with effort", "Variation across workday tasks and Dev’s own hypotheses", "Whether a selected response is useful without adding unwanted monitoring"], "opening": "I am not here to hide my stutter. Some words feel like a fight, and I would like more choice in those moments.", "priority": "I still enjoy talking. Please do not assume the number of stutters tells you how my life is going.", "motor": "I would try an easier way through a stuck word, as long as I can decide when it helps.", "motorOptions": ["Could we identify a moment you want to explore and compare an easier response with your experience of effort?", "Could we begin by targeting near-zero stuttering in all salon conversations because the stuttering is noticeable?"], "motorReactions": ["Yes. I want an option, not an instruction to erase every stutter.", "That is a different goal from the one I brought."], "motorReason": "The chapter distinguishes stuttering frequency, effort, communication, and agency. Visible severity alone does not select the person’s goal.", "meaning": "A previous clinician said I must fear stuttering because I declined a technique. I declined because it interrupted my listening.", "meaningOptions": ["Could we understand that tradeoff from your perspective and test whether a smaller change fits better?", "Could we interpret declining the technique as evidence that you need to accept the clinician’s view of the problem?"], "meaningReactions": ["That is the conversation I wanted to have.", "That would repeat the assumption I just explained."], "meaningReason": "The rationale and meaning of a technique should be shared. Refusing one technique does not by itself establish fear, low motivation, or lack of acceptance.", "goalQuote": "Could success mean less fighting with a word while
