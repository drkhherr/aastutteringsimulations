e?", "refs": ["M_ALLIANCE", "M_EFFORT"], "choices": [{"text": "Shall we use a chosen conversation and your effort and message ratings to define useful change, with stuttering still allowed?", "reply": "Yes. I want to keep enjoying the interaction.", "next": "practice", "feedback": "This is agreement to a starting focus, not approval of every future activity or typed goal. Establish a baseline and negotiate specific criteria and review points.", "stance": "explore", "agreement": "Yes. I want to keep enjoying the interaction.", "id": "A"}, {"text": "Shall we make audible fluency the main outcome even if it requires constant monitoring you do not want?", "reply": "A fluent performance that stops me listening would not be a useful outcome.", "next": "goal_repair", "feedback": "A measurable target can still be poorly matched to the person’s purpose. Revise its domain, context, sequence, or meaning before treating it as shared.", "stance": "revisit", "agreement": null, "id": "B"}]}, "goal_repair": {"id": "goal_repair", "stage": "Revising the proposed goal", "client": "That goal is not quite what I asked for. What part can we change?", "discussion": "Which element of the goal did the client decline?", "refs": ["M_ALLIANCE", "M_COGNITION"], "choices": [{"text": "Could we keep my target as the main goal and treat your preferred outcome as a possible later benefit?", "reply": "I have not agreed to that goal.", "next": "provisional", "feedback": "The proposed goal remains unshared. Your written plan should identify the disagreement and a next conversation, not present the target as accepted.", "stance": "revisit", "agreement": null, "id": "A"}, {"text": "Let us rewrite the goal around the situation and change you chose. We can agree on measures and a review point after a baseline.", "reply": "Yes. I want to keep enjoying the interaction.", "next": "practice", "feedback": "Revision gives the client an active role in defining success. Exact targets remain provisional until discussed.", "stance": "explore", "agreement": "Yes. I want to keep enjoying the interaction.", "id": "B"}]}, "practice": {"id": "practice", "stage": "Planning feasible practice", "client": "I can try a brief conversation between bookings. I do not want to turn every customer visit into a practice assignment.", "discussion": "What resources are actually available? Avoid inferring motivation from money, schedule, age, or occupation.", "refs": ["M_TRANSFER", "M_ALLIANCE"], "choices": [{"text": "Could we choose one low-pressure exchange and compare the response only when you want to use it?", "reply": "That feels like a manageable experiment.", "next": "review", "feedback": "Practice must fit the stated access conditions and the client’s choices. Explain the first task and how the client can change it.", "stance": "explore", "agreement": "That feels like a manageable experiment.", "id": "A"}, {"text": "Could we require tracking every stutter with every customer for the whole workday?", "reply": "That would take me out of the conversations I value.", "next": "access", "feedback": "An ambitious plan is not automatically an accessible plan. The client’s actual constraint needs a change in format, dose, support, or timing.", "stance": "revisit", "agreement": null, "id": "B"}]}, "access": {"id": "access", "stage": "Renegotiating the arrangement", "client": "I can consider one chosen low-pressure exchange between bookings. I cannot commit to the arrangement we just discussed.", "discussion": "How could you keep the clinical purpose while changing the arrangement?", "refs": ["M_ALLIANCE", "M_TRANSFER"], "choices": [{"text": "Could we retain the original schedule as a test of readiness before considering a different arrangement?", "reply": "That still does not fit what I can agree to.", "next": "provisional", "feedback": "The arrangement remains unagreed. Document the barrier and another invitation or assessment step rather than assuming the client can follow it.", "stance": "revisit", "agreement": null, "id": "A"}, {"text": "Could we agree on a smaller or different arrangement that fits, then decide together at a review point whether to continue?", "reply": "That feels like a manageable experiment.", "next": "review", "feedback": "This negotiates feasibility rather than interpreting a barrier as noncompliance. The exact arrangement needs the client’s confirmation.", "stance": "explore", "agreement": "That feels like a manageable experiment.", "id": "B"}]}, "review": {"id": "review", "stage": "Interpreting a fictional follow-up", "client": "In this fictional follow-up, I still stuttered openly, but one chosen response reduced the effort in a few difficult words. I enjoyed the conversation.", "discussion": "What improved, what remains uncertain, and what would justify continuing, adapting, or reducing treatment?", "refs": ["M_EFFORT", "M_TRANSFER"], "choices": [{"text": "Let us review comfort, enjoyment, and participation, and decide whether the option is useful enough to keep.", "reply": "I want those parts of my experience included when we decide what to keep or change.", "next": "complete", "feedback": "Review the domains actually targeted, the client’s perspective, and evidence beyond the clinic. The hypothetical follow-up is authored teaching content, not a predicted treatment response.", "stance": "explore", "agreement": null, "id": "A"}, {"text": "Should we classify the work as ineffective because stuttering remained obvious?", "reply": "That leaves out changes that mattered to me. Can we look at the whole experience?", "next": "review_repair", "feedback": "A speech count is one possible measure. It does not, by itself, settle effort, participation, agency, satisfaction, or maintenance.", "stance": "revisit", "agreement": null, "id": "B"}]}, "review_repair": {"id": "review_repair", "stage": "Broadening the review", "client": "I need you to include the message, the effort, and whether I could do what I wanted.", "discussion": "Which measures answer this client’s goals, and which do not?", "refs": ["M_EFFORT", "M_ALLIANCE"], "choices": [{"text": "Could we keep the speech count as the deciding outcome and defer the other information?", "reply": "That would leave our plan only partly agreed.", "next": "provisional", "feedback": "The outcome criteria remain mismatched. The group should state the unresolved issue and how it would reopen the conversation.", "stance": "revisit", "agreement": null, "id": "A"}, {"text": "Let us review those outcomes together with any speech measures and decide which next step is useful to you.", "reply": "That is the kind of review I wanted.", "next": "complete", "feedback": "This broadens the outcome discussion without ignoring speech. The group still needs to specify how the chosen domains will be measured.", "stance": "explore", "agreement": null, "id": "B"}]}, "complete": {"id": "complete", "terminal": true, "title": "A starting focus is shared", "client": "The focus fits. I want to review the specific goals, practice tasks, and check-in arrangements before we finalize them.", "task": "Draft a provisional collaborative plan. Agreement in the script concerns the starting focus, not automatic approval of your written targets.", "choices": []}, "pause": {"id": "pause", "terminal": true, "title": "The client chooses to pause", "client": "I do not want to continue this version today. I may want to discuss different options later.", "task": "Respect the pause. Identify the mismatch, what is known and unknown, and an invitation or assessment plan that does not assume consent to a treatment sequence.", "choices": []}, "provisional": {"id": "provisional", "terminal": true, "title": "Part of the plan remains unshared", "client": "Some of this could be useful, but I have not agreed to the goal, arrangement, or way we would judge progress.", "task": "Identify the unresolved issue. Draft possible alternatives and the next conversation rather than describing the disputed part as an accepted treatment plan.", "choices": []}}, "start": "opening", "caseNumber": 7, "debrief": ["Which client statement changed your formulation?", "What would you still need to assess before finalizing treatment?", "Where did a response risk making fluent appearance the only outcome?", "What did your group negotiate rather than assume?", "Which response would you rewrite beyond the two provided options?"]}, {"id": "daniel", "name": "Daniel", "age": 56, "pronouns": "he/him", "gender": "Man", "role": "Senior software engineer", "setting": "Remote team and home", "resources": "Stable salary and good internet access. Scheduling is flexible. His spouse wants to help but often reminds his to use techniques.", "focus": "Chosen support, group participation, and clinician control", "vignette": "Daniel has persistent childhood-onset stuttering. He has useful speech responses from earlier therapy but avoids a few team discussions. He is curious about a group while uneasy about being asked to disclose personal experiences. His spouse frequently cues technique use in conversation. Daniel finds those cues intrusive but does not want to exclude his spouse from every discussion.", "findings": ["Daniel values problem-solving with colleagues and wants to contribute more in meetings.", "He wants support without speech correction during family conversations.", "He has not visited a group or negotiated boundaries for participation."], "unknowns": ["Which meeting situations he wants to approach", "What help he wants from his spouse and how to communicate that preference", "Whether a group’s format and norms would fit his"], "opening": "My spouse means well, but reminders to use a tool make me stop talking. Do I have to involve them or join a group?", "priority": "I want to share my ideas at work and choose what support looks like. I might observe a group before talking.", "motor": "I know a response that can help. The problem is being told to use it when I am trying to explain an idea.", "motorOptions": ["Could we compare when you choose that response with when reminders make it harder, and agree what you want from listeners?", "Could we enlist your spouse to cue every disruption so practice continues whenever you talk?"], "motorReactions": ["I can explain the difference between a choice and a correction.", "That would make ordinary conversations feel like more treatment."], "motorReason": "Recruiting support does not require making a partner responsible for constant correction. Shared understanding should support the client’s agency and communication.", "meaning": "A group could be helpful, but I do not want to answer personal questions before I know the people.", "meaningOptions": ["Could we explore the group’s norms and whether observing first would let you decide if it fits?", "Could we require immediate personal disclosure as evidence that you are committed to the group?"], "meaningReactions": ["An observation visit would let me make an informed choice.", "I would probably avoid that group completely."], "meaningReason": "The chapter allows a reluctant participant to observe initially and emphasizes nonjudgmental group norms. Participation should not be reduced to forced disclosure.", "goalQuote": "I want to offer my idea in a team meeting and have a conversation at home without being corrected.", "goalGood": "Shall we choose a meeting contribution and negotiate what support you want, tracking participation and your experience?", "goalOther": "Shall we define success as accepting every reminder and speaking personally at the first group meeting?", "goalReply": "Yes. I can decide what to ask my spouse for and whether to try the group.", "goalPushback": "Those requirements would hand control of my speaking to other people.", "practiceQuote": "I can rehearse a short update and invite my spouse for a discussion about support, but only with an agreed purpose.", "feasible": "Could we set that purpose together and make a group observation visit optional?", "burden": "Could we invite your spouse and enroll you in a group before discussing the boundaries?", "feasibleReply": "That gives me a role in choosing both kinds of support.", "burdenReply": "I have not agreed to either arrangement that way.", "review": "In this fictional follow-up, I contributed an idea and asked my spouse to listen rather than cue. I visited a group silently and want more time before joining.", "reviewGood": "Let us recognize the chosen participation and support changes, and let your group decision remain open.", "reviewOther": "Should we treat silent observation as failure to engage and make disclosure the next required step?", "priorities": ["Contributing ideas", "Support without unwanted correction", "Choice about group involvement"], "starter": "A rehearsed team contribution and a negotiated support conversation", "adjustment": "chosen support and a group visit without pressure to disclose", "examples": ["Daniel will make a chosen team contribution and evaluate message completion, effort, and the usefulness of any strategy he elects to use.", "Daniel will negotiate one desired listener response with his spouse and evaluate whether it supports continued conversation."], "sessions": ["Clarify meeting priorities and distinguish chosen tool use from unwanted correction.", "Plan a real meeting contribution and, with Daniel’s agreement, a focused support conversation or optional group observation."], "refs": ["M_ALLIANCE", "M_TRANSFER", "M_GROUPS", "M_COGNITION"], "nodes": {"opening": {"id": "opening", "stage": "Starting with the client", "client": "My spouse means well, but reminders to use a tool make me stop talking. Do I have to involve them or join a group?", "discussion": "What is the client asking for, and what would you need to learn before recommending a method?", "refs": ["M_ALLIANCE"], "choices": [{"text": "Could we begin with the speech pattern I usually teach, then return to your priorities after we see how fluently you can use it?", "reply": "I was hoping my reasons for coming would help decide what we do first.", "next": "repair", "feedback": "A speech trial can be useful, but this timing postpones the stated priority and risks turning a trial into an imposed starting point.", "stance": "revisit", "agreement": null, "id": "A"}, {"text": "Before choosing a method, could we understand what you want to be different and what you do not want from therapy?", "reply": "I want to share my ideas at work and choose what support looks like. I might observe a group before talking.", "next": "explore", "feedback": "This response invites the client’s purpose before choosing a protocol. It begins an assessment conversation rather than assuming all goals are already known.", "stance": "explore", "agreement": null, "id": "B"}]}, "repair": {"id": "repair", "stage": "Repairing the conversation", "client": "I do not feel that the plan starts with what I said. Can we slow down?", "discussion": "How could you acknowledge the mismatch without defending your expertise?", "refs": ["M_ALLIANCE"], "choices": [{"text": "You are right that I moved too quickly. What feels most important for us to understand before deciding on a plan?", "reply": "I want to share my ideas at work and choose what support looks like. I might observe a group before talking.", "next": "explore", "feedback": "Acknowledging a mismatch can restore collaboration. The following branch returns to exploration; agreement still has to be earned.", "stance": "explore", "agreement": null, "id": "A"}, {"text": "Would you be willing to complete my usual sequence first so we can decide later whether your priorities need a different approach?", "reply": "I do not want to commit to that sequence today.", "next": "pause", "feedback": "The client declines the proposed sequence. Respect that boundary and identify what can be offered or discussed without assuming treatment agreement.", "stance": "revisit", "agreement": null, "id": "B"}]}, "explore": {"id": "explore", "stage": "Choosing the next assessment focus", "client": "I want to share my ideas at work and choose what support looks like. I might observe a group before talking.", "discussion": "Both choices can be useful. Explain what your first choice would reveal and what it would leave unanswered.", "refs": ["M_CHOICE", "M_EFFORT"], "choices": [{"text": "Could we first explore the situation you want to enter, your expectations, and the support or changes that might matter?", "reply": "A group could be helpful, but I do not want to answer personal questions before I know the people.", "next": "meaning", "feedback": "Exploring participation and meaning can clarify the plan. Relevant speech behavior still needs attention when the client wants it. Both assessment routes are defensible starting points.", "stance": "tradeoff", "agreement": null, "id": "A"}, {"text": "Could we explore the physical speaking experience in a task you choose, including effort and what any response would cost you?", "reply": "I know a response that can help. The problem is being told to use it when I am trying to explain an idea.", "next": "motor", "feedback": "A contextual speech trial can be informative. It does not replace the client’s account of participation or reactions. This branch prioritizes speech exploration, not a universal best approach.", "stance": "tradeoff", "agreement": null, "id": "B"}]}, "motor": {"id": "motor", "stage": "Exploring a speech option", "client": "I know a response that can help. The problem is being told to use it when I am trying to explain an idea.", "discussion": "What would you explain and measure before deciding this trial belongs in a treatment plan?", "refs": ["M_TRANSFER"], "choices": [{"text": "Could we compare when you choose that response with when reminders make it harder, and agree what you want from listeners?", "reply": "I can explain the difference between a choice and a correction.", "next": "goal", "feedback": "Recruiting support does not requir asks, and check-in arrangements before we finalize them.", "task": "Draft a provisional collaborative plan. Agreement in the script concerns the starting focus, not automatic approval of your written targets.", "choices": []}, "pause": {"id": "pause", "terminal": true, "title": "The client chooses to pause", "client": "I do not want to continue this version today. I may want to discuss different options later.", "task": "Respect the pause. Identify the mismatch, what is known and unknown, and an invitation or assessment plan that does not assume consent to a treatment sequence.", "choices": []}, "provisional": {"id": "provisional", "terminal": true, "title": "Part of the plan remains unshared", "client": "Some of this could be useful, but I have not agreed to the goal, arrangement, or way we would judge progress.", "task": "Identify the unresolved issue. Draft possible alternatives and the next conversation rather than describing the disputed part as an accepted treatment plan.", "choices": []}}, "start": "opening", "caseNumber": 9, "debrief": ["Which client statement changed your formulation?", "What would you still need to assess before finalizing treatment?", "Where did a response risk making fluent appearance the only outcome?", "What did your group negotiate rather than assume?", "Which response would you rewrite beyond the two provided options?"]}, {"id": "iris", "name": "Iris", "age": 73, "pronouns": "she/her", "gender": "Woman", "role": "Retired physics professor and digital book-club organizer", "setting": "University town", "resources": "Financially secure with reliable technology and a flexible schedule. She wants a clear rationale for using her time in therapy rather than assuming retirement creates unlimited availability.", "focus": "Personal meaning, new speaking roles, and behavioral experiments", "vignette": "Iris has stuttered since childhood and has led a full professional life. She is considering public readings of her own essays but says an old identity as the person who lets others read aloud still limits her. She speaks comfortably while organizing book-club logistics yet discounts those occasions as exceptions. She wants to explore a new speaking role, not be promised a cure.", "findings": ["Iris already speaks effectively in familiar organizer roles.", "She predicts that a reading by its author must sound fluent to be worthwhile.", "She is interested in experimentation and has a supportive writing partner."], "unknowns": ["What authorship and public reading mean to Iris", "Which predictions she wants to test and what evidence she would consider meaningful", "Whether any optional speech response would support or distract from the reading"], "opening": "I have spent years being the person who lets someone else read my words. I want to see if I can take that role myself.", "priority": "I handle book-club discussion well, but I treat that as an exception. Reading my own essay feels different.", "motor": "A speech response might help some moments, but I do not want it to take over the meaning of the essay.", "motorOptions": ["Could we compare an optional response on a short passage and ask whether it supports the message and your experience?", "Could we make an extended fluent-reading pattern the prerequisite for exploring the author role?"], "motorReactions": ["I can compare it without making it a condition for reading.", "That would postpone the role I came here to explore."], "motorReason": "Speech targets can be considered alongside spontaneity and meaning. A technique should serve the client’s chosen role rather than become an unexamined gate to it.", "meaning": "I predict the reading will feel ruined if I block, even though people listen closely when I lead discussions.", "meaningOptions": ["Would you like to state that prediction, read a short chosen passage to your partner, and compare what actually happens?", "Could we tell you the prediction is irrational and require a public reading before discussing it further?"], "meaningReactions": ["A small experiment would give us something real to examine.", "Being told what to think would not help me make this role my own."], "meaningReason": "Controlled elaboration compares predictions with experience and can expand a meaningful speaking role. It does not require the clinician to replace the client’s story by assertion.", "goalQuote": "I want to read a passage as its author and stay with its meaning, whether or not I stutter.", "goalGood": "Shall we negotiate an initial reading and track authorship, message engagement, effort, and what you learn about the prediction?", "goalOther": "Shall we define a successful reading only as one without blocks, even if you keep handing the reading to others?", "goalReply": "Yes. I can start with my writing partner and decide what comes next.", "goalPushback": "That would preserve the old restriction rather than test it.", "practiceQuote": "I can record a short passage and read to my writing partner. I do not want a public event scheduled for me.", "feasible": "Could we choose the passage and listener together, with any larger audience left for a later decision?", "burden": "Could we book a public reading now so that a deadline makes the choice for you?", "feasibleReply": "That lets me take the next step myself.", "burdenReply": "I have not agreed to that audience or deadline.", "review": "In this fictional follow-up, I read the passage myself. There were blocks, but I stayed with the essay and wanted to keep going. The experience did not feel ruined.", "reviewGood": "Let us compare that experience with your prediction and ask what, if anything, you want to try next.", "reviewOther": "Should we discount the change in meaning because the reading still contained blocks?", "priorities": ["Reading as the author", "Expanding a personally meaningful role", "Testing predictions without a fluency promise"], "starter": "A short chosen essay passage with her writing partner", "adjustment": "a xt": "Could we explore the physical speaking experience in a task you choose, including effort and what any response would cost you?", "reply": "A speech response might help some moments, but I do not want it to take over the meaning of the essay.", "next": "motor", "feedback": "A contextual speech trial can be informative. It does not replace the client’s account of participation or reactions. This branch prioritizes speech exploration, not a universal best approach.", "stance": "tradeoff", "agreement": null, "id": "B"}]}, "motor": {"id": "motor", "stage": "Exploring a speech option", "client": "A speech response might help some moments, but I do not want it to take over the meaning of the essay.", "discussion": "What would you explain and measure before deciding this trial belongs in a treatment plan?", "refs": ["M_EFFORT", "M_TRANSFER"], "choices": [{"text": "Could we compare an optional response on a short passage and ask whether it supports the message and your experience?", "reply": "I can compare it without making it a condition for reading.", "next": "goal", "feedback": "Speech targets can be considered alongside spontaneity and meaning. A technique should serve the client’s chosen role rather than become an unexamined gate to it.", "stance": "explore", "agreement": null, "id": "A"}, {"text": "Could we make an extended fluent-reading pattern the prerequisite for exploring the author role?", "reply": "That would postpone the role I came here to explore.", "next": "adjust", "feedback": "Speech targets can be considered alongside spontaneity and meaning. A technique should serve the client’s chosen role rather than become an unexamined gate to it. Revisit the assumption exposed by the client’s response.", "stance": "revisit", "agreement": null, "id": "B"}]}, "meaning": {"id": "meaning", "stage": "Exploring meaning and participation", "client": "I predict the reading will feel ruined if I block, even though people listen closely when I lead discussions.", "discu ": "Let us compare that experience with your prediction and ask what, if anything, you want to try next.", "reply": "I want those parts of my experience included when we decide what to keep or change.", "next": "complete", "feedback": "Review the domains actually targeted, the client’s perspective, and evidence beyond the clinic. The hypothetical follow-up is authored teaching content, not a predicted treatment response.", "stance": "explore", "agreement": null, "id": "B"}]}, "review_repair": {"id": "review_repair", "stage": "Broadening the review", "client": "I need you to include the message, the effort, and whether I could do what I wanted.", "discussion": "Which measures answer this client’s goals, and which do not?", "refs": ["M_EFFORT", "M_ALLIANCE"], "choices": [{"text": "Let us review those outcomes together with any speech measures and decide which next step is useful to you.", "reply": "That is the kind of review I wanted.", "next": "complete", "feedback": "This broadens the outcome discussion without ignoring speech. The group still needs to specify how the chosen domains will be measured.", "stance": "explore", "agreement": null, "id": "A"}, {"text": "Could we keep the speech count as the deciding outcome and defer the other information?", "reply": "That would leave our plan only partly agreed.", "next": "provisional", "feedback": "The outcome criteria remain mismatched. The group should state the unresolved issue and how it would reopen the conversation.", "stance": "revisit", "agreement": null, "id": "B"}]}, "complete": {"id": "complete", "terminal": true, "title": "A starting focus is shared", "client": "The focus fits. I want to review the specific goals, practice tasks, and check-in arrangements before we finalize them.", "task": "Draft a provisional collaborative plan. Agreement in the script concerns the starting focus, not automatic approval of your written targets.", "choices": []}, "pause": {"id": "pause", "terminal": true, "title": "The client tance, and avoidance reduction."}, "M_DISCLOSURE": {"label": "Manning \u0026 DiLollo, Ch. 12, PDF pp. 23–25", "concept": "Context, listener responses, and acknowledgment of stuttering."}, "M_DEVICES": {"label": "Manning \u0026 DiLollo, Ch. 12, PDF pp. 28–29", "concept": "Variable device effects and the distinction between fluency and satisfaction."}, "M_TEEN": {"label": "Manning \u0026 DiLollo, Ch. 12, PDF pp. 33–36", "concept": "Adolescent priorities, readiness, autonomy, and motivational interviewing."}, "M_GROUPS": {"label": "Manning \u0026 DiLollo, Ch. 12, PDF pp. 38–43", "concept": "Group mechanisms, chosen participation, norms, and leadership."}, "C_ASSESS": {"label": "Coleman et al. (2015), PDF pp. 1–2 / journal pp. 5–6", "concept": "Multidimensional, ICF-informed assessment and the speaker’s perspective."}, "C_HIERARCHY": {"label": "Coleman et al. (2015), PDF pp. 2–4 / journal pp. 6–8", "concept": "Education, reactions, individual hierarchies, and strategy demands in an adolescent vignette."}, "C_DISCHARGE": {"label": "Coleman et al. (2015), PDF p. 4 / journal p. 8", "concept": "Early discharge planning and possible future brief therapy in the adolescent vignette."}}, "planFields": [["priorities", "Client priorities and how you elicited them", "Name the client’s words or decisions that support these priorities."], ["assessment", "Assessment gaps and next information", "What would you still need to assess before finalizing a real plan?"], ["goal1", "Goal 1 developed with the client", "Specify context, observable action or experience, baseline needed, negotiated criterion, and review point."], ["goal2", "Goal 2 developed with the client", "Address another agreed domain, such as effort, speech options, reactions, agency, or participation."], ["approach", "Treatment approach and source-based rationale", "Explain why this approach or blend fits this client. Cite a source page."], ["sessions", "First two sessions", "State the sequence, purpose, client choices, and (function () {

    if(saved && saved.version===1){state={...state,...saved};

  } catch (_) {persistence='Browser storage is unavailable. Keep this tab open and export your work.';}

    const n=$('#storage-status');if(n)n.textContent=persistence;
  }
  function cite(ids){return (ids||[]).map(id=>`<li>${esc(DATA.sources[id].label)}. ${esc(DATA.sources[id].concept)}</li>`).join('');}
  function list(xs){return `<ul>${xs.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>`;}
  function status(c){const r=state.cases[c.id];return !r?'Not started':c.nodes[r.node].terminal?'Conversation complete':r.log.length?'In progress':'Ready';}
  function header(){return `<header class="app-header"><div><div class="eyebrow">GRADUATE SMALL-GROUP ACTIVITY</div><h1>Stuttering Clinical Simulation Lab</h1><p>Ten client conversations about goals, choice, and treatment planning</p></div><button class="secondary" data-action="help">How to run this</button></header>
    <nav class="tabs" aria-label="Activity sections">${[['cases','Cases'],['conversation','Conversation'],['plan','Group plan'],['debrief','Debrief'],['instructor','Instructor guide and matrix']].map(([id,label])=>`<button data-tab="${id}" ${state.tab===id?'aria-current="page"':''} ${['conversation','plan','debrief'].includes(id)&&!state.active?'disabled':''}>${label}</button>`).join('')}</nav>`;}
  function caseCards(){return `<section><div class="section-head"><div><h2 tabindex="-1" id="page-heading">Choose a case</h2><p>One case per breakout room. Plan about 45 minutes for conversation, planning, and debrief.</p></div><div class="notice compact">All cases are fictional. Demographic details provide context; they do not determine a treatment choice.</div></div>
    <div class="case-grid">${DATA.cases.map(c=>`<article class="case-card"><div class="case-top"><span class="case-number">${String(c.caseNumber).padStart(2,'0')}</span><span class="status">${status(c)}</span></div><h3>${esc(c.name)} <span>${c.age} · ${esc(c.pronouns)}</span></h3><p class="role">${esc(c.role)}</p><p>${esc(c.focus)}</p><p class="context">${esc(c.setting)}</p><button class="primary" data-case="${c.id}">${status(c)==='Not started'?'Open case':'Return to case'}</button></article>`).join('')}</div></section>`;}
  function sidebar(c){return `<aside class="case-sidebar"><div class="eyebrow">CASE ${String(c.caseNumber).padStart(2,'0')}</div><h2>${esc(c.name)}, ${c.age}</h2><p>${esc(c.pronouns)} · ${esc(c.gender)}</p><p><strong>${esc(c.role)}</strong><br>${esc(c.setting)}</p><details open><summary>Clinical vignette</summary><p>${esc(c.vignette)}</p></details><details><summary>Reported findings</summary>${list(c.findings)}</details><details><summary>Resources and access</summary><p>${esc(c.resources)}</p></details><details><summary>What remains to assess</summary>${list(c.unknowns)}</details><div class="source-note">These details describe this individual. Do not infer goals, readiness, or communication ability from a demographic label.</div></aside>`;}
  function settings(){return `<div class="settings"><label>Feedback timing <select id="feedback-mode"><option value="practice" ${state.mode==='practice'?'selected':''}>After each choice</option><option value="seminar" ${state.mode==='seminar'?'selected':''}>At debrief only</option></select></label><label class="check"><input type="checkbox" id="require-reason" ${state.requireReason?'checked':''}> Record reasoning before a choice</label></div>`;}
  function pendingView(c,r){const e=r.pending;return `<section class="conversation-panel"><h2 id="page-heading" tabindex="-1">${esc(c.name)} responds</h2><blockquote class="client-quote">${esc(e.reply)}</blockquote>

  function conversation(){const c=current(),r=record(),n=c.nodes[r.node];let panel;

    return `<section class="plan-page"><div class="section-head"><div><h2 id="page-heading" tabindex="-1">${esc(c.name)}: group treatment plan</h2><p>Write provisional goals and a plan in collaboration with the client’s stated priorities.</p></div><button class="secondary" data-tab="conversation">Return to conversation</button></div>

      <details open class="plan-context"><summary>Client information to carry into the plan</summary><p><strong>Stated priorities:</strong> ${esc(c.priorities.join('; '))}</p><p><strong>Access:</strong> ${esc(c.resources)}</p>${agreed.length?'<strong>Agreements reached in this route</strong>'+list(agreed):'<p>No starting focus has been agreed in this route yet.</p>'}<p>These are starting agreements. The client has not automatically approved the goals you type below.</p></details>
      <label class="field-label" for="group-name">Group names or identifier</label><input id="group-name" type="text" value="${esc(r.group)}" placeholder="Use a group label; do not enter real client information.">
      <div class="plan-fields">${DATA.planFields.map(([id,title,prompt])=>`<div class="plan-field"><label class="field-label" for="plan-${id}">${esc(title)}</label><p class="field-help" id="help-${id}">${esc(prompt)}</p><textarea data-plan="${id}" id="plan-${id}" aria-describedby="help-${id}" rows="${id==='hierarchy'||id==='sessions'?4:3}">${esc(r.draft[id]||'')}</textarea></div>`).join('')}</div>
      <p id="export-status" role="status"></p><div class="button-row"><button class="primary" data-action="copy">Copy group report</button><button class="secondary" data-action="export-text">Download report as text</button><button class="secondary" data-action="export-json">Download route and plan as JSON</button></div><p class="fine-print">Downloads are local files. The app does not submit to Canvas or synchronize between group members.</p></section>`;
  }
  function history(c,r,includeFeedback){return r.log.map((e,i)=>`<details class="history-item"><summary>${i+1}. ${esc(e.stage)} · response ${e.choiceId}</summary><p><strong>Client:</strong> ${esc(e.client)}</p><p><strong>Chosen response:</strong> ${esc(e.choiceText)}</p><p><strong>Group reasoning:</strong> ${esc(e.reason||'Not recorded')}</p><p><strong>Client reply:</strong> ${esc(e.reply)}</p>${includeFeedback?`<p><strong>Feedback:</strong> ${esc(e.feedback)}</p><ul class="references">${cite(e.refs)}</ul>`:''}</details>`).join('');}
  function debrief(){const c=current(),r=record(),n=c.nodes[r.node];if(!n.terminal||r.pending)return `<section><h2 id="page-heading" tabindex="-1">Finish the conversation first</h2><p>The debrief will include the chosen route, client replies, and reading connections.</p><button class="primary" data-tab="conversation">Continue conversation</button></section>`;
    return `<section><h2 id="page-heading" tabindex="-1">${esc(c.name)}: debrief</h2><p class="notice"><strong>${esc(n.title)}.</strong> ${esc(n.task)}</p><h3>Questions for the group</h3>${list(c.debrief)}<h3>Your decision route</h3>${history(c,r,true)}<p>${r.attempts.length} earlier route${r.attempts.length===1?'':'s'} retained in the downloadable JSON.</p><h3>Check the proposed plan</h3>${list(['Does it reflect the client’s own priorities and any declined options?','Do goals name a situation, action or experience, baseline, negotiated criterion, and review point?','Does the plan explain the rationale, feasible practice, chosen support, and progress beyond a speech count?','Does it identify what remains unknown or unagreed?'])}<div class="button-row"><button class="primary" data-tab="plan">Revise group plan</button><button class="secondary" data-action="restart">Try another route</button><button class="secondary" data-action="export-text">Download report</button></div></section>`;
  }
  function instructor(){const selected=current()||DATA.cases[0];return `<section><h2 id="page-heading" tabindex="-1">Instructor guide and decision matrix</h2><p>Use one case per group of 3–4. This is a discussion simulation, not a secure examination or a validated measure of clinical competence.</p><div class="guide-grid"><article><h3>45-minute sequence</h3>${list(['5 minutes: assign reader/clinician, client advocate, evidence consultant, and recorder. Combine roles in groups of three.','12 minutes: read the vignette, discuss each pair, record reasoning, and follow the client’s replies.','15 minutes: write two provisional goals and the treatment plan. Identify assessment gaps and the client agreement still needed.','8 minutes: compare routes or ask another group to review one goal and one adaptation.','5 minutes: debrief one changed assumption and one better response beyond the scripted choices.'])}</article><article><h3>Facilitation</h3>${list(['In Zoom, one student shares the browser and operates the simulation; the others consult the readings and can co-write in a shared Google Doc.','The app is not a multiuser collaboration service. Copy the report into your shared document or upload a downloaded report as you normally would.','Use feedback after each choice for guided practice, or reserve it for the debrief.','A clinician can repair a mismatch. Respect a pause or unresolved agreement rather than forcing a technique plan.','Role-play the clinician’s explanation if useful; students need not imitate stuttering.'])}</article></div>
      <h3>Case examples and matrix</h3><label class="field-label" for="matrix-case">Select a case</label><select id="matrix-case">${DATA.cases.map(c=>`<option value="${c.id}" ${c.id===selected.id?'selected':''}>${c.caseNumber}. ${esc(c.name)}, ${c.age} — ${esc(c.focus)}</option>`).join('')}</select><div id="matrix-detail">${matrixView(selected)}</div>
      <h3>Source boundaries</h3><p>${esc(DATA.scope)}</p><p>Page locators refer to the assigned PDFs, not the app or an outside source. The chapter does not display its publication year. Demographics and access details are case facts, not evidence that a group prefers a particular intervention.</p><ul class="references">${DATA.references.map(r=>`<li>${esc(r)}</li>`).join('')}</ul><h3>Data and use</h3><p>No account, network request, or external library is required. Enter only fictional case information. Work may be saved in this browser; use downloads for a portable record. Instructor examples are visible here and are not hidden behind a password.</p></section>`;}
  function matrixView(c){return `<h3>${esc(c.name)}: possible planning directions</h3><p>These examples are discussion anchors. They are not a single correct plan, fixed dosage, or goals already approved by the scripted client.</p><h4>Possible goals to negotiate</h4>${list(c.examples)}<h4>Possible first two sessions</h4>${list(c.sessions)}<h4>Relevant reading connections</h4><ul class="references">${cite(c.refs)}</ul><h4>Decision matrix</h4><p>Every decision has two choices. Branches converge where a new conversation can resume; they are not a fully expanded binary tree.</p>${Object.values(c.nodes).map(n=>n.terminal?`<details class="matrix-node"><summary>${esc(n.id)} · ending</summary><p><strong>${esc(n.title)}</strong></p><p>${esc(n.client)}</p><p>${esc(n.task)}</p></details>`:`<details class="matrix-node"><summary>${esc(n.id)} · ${esc(n.stage)}</summary><blockquote>${esc(n.client)}</blockquote><div class="table-wrap"><table><thead><tr><th>Choice</th><th>Clinician response</th><th>Client reply</th><th>Next node</th><th>Rationale</th></tr></thead><tbody>${n.choices.map(ch=>`<tr><td>${ch.id}</td><td>${esc(ch.text)}</td><td>${esc(ch.reply)}</td><td>${esc(ch.next)}</td><td>${esc(ch.feedback)}</td></tr>`).join('')}</tbody></table></div><ul class="references">${cite(n.refs)}</ul></details>`).join('')}`;}
  function render(focus=false){if(['conversation','plan','debrief'].includes(state.tab)&&!state.active)state.tab='cases';
    const content=state.tab==='cases'?caseCards():state.tab==='conversation'?conversation():state.tab==='plan'?plan():state.tab==='debrief'?debrief():instructor();
    $('#app').innerHTML=header()+`<main>${content}</main><footer><span id="storage-status">${esc(persistence)}</span><span>Fictional teaching cases · Chapter 12 and Coleman et al.</span></footer>`;
    if(focus){const h=$('#page-heading');if(h)h.focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});}
  }
  function selectCase(id){if(!DATA.cases.some(c=>c.id===id))return;state.active=id;record();state.tab='conversation';save();render(true);}
  function choose(id,reason){const c=current(),r=record(),n=c.nodes[r.node];if(r.pending||n.terminal)return false;
    const ch=n.choices.find(x=>x.id===id);if(!ch)return false;
    reason=String(reason??r.scratch).trim();
    if(state.requireReason&&reason.length<10){const e=$('#reason-error');if(e)e.textContent='Record a short reason (at least 10 characters) before choosing.';return false;}
    const e={node:n.id,stage:n.stage,client:n.client,choiceId:ch.id,choiceText:ch.text,reason,reply:ch.reply,feedback:ch.feedback,refs:n.refs,next:ch.next,stance:ch.stance,agreement:ch.agreement};
    r.log.push(e);r.pending=e;r.scratch='';save();render(true);return true;
  }
  function continueConversation(){const r=record();if(!r||!r.pending)return;r.node=r.pending.next;r.pending=null;save();render(true);}
  function restart(){const r=record();if(!r)return;if(r.log.length)r.attempts.push({log:r.log,node:r.node,pending:r.pending});r.node='opening';r.log=[];r.pending=null;r.scratch='';state.tab='conversation';save();render(true);}
  function reportObject(){const c=current(),r=record();return {schemaVersion:1,caseId:c.id,caseNumber:c.caseNumber,client:c.name,group:r.group,outcome:r.pending?'Conversation in progress':c.nodes[r.node].title||'Conversation in progress',plan:{...r.draft},route:r.log,earlierRoutes:r.attempts,scope:DATA.scope};}
  function reportText(){const c=current(),r=record(),o=reportObject();let s=`STUTTERING CLINICAL SIMULATION LAB\nCase ${c.caseNumber}: ${c.name}, ${c.age} (${c.pronouns})\nGroup: ${r.group||'Not recorded'}\nOutcome: ${o.outcome}\n\n`;
    for(const [id,title]of DATA.planFields)s+=`${title.toUpperCase()}\n${r.draft[id]||'[To be completed]'}\n\n`;
    s+='DECISION ROUTE\n';r.log.forEach((e,i)=>{s+=`\n${i+1}. ${e.stage}\nClient: ${e.client}\nChosen response ${e.choiceId}: ${e.choiceText}\nGroup reasoning: ${e.reason||'[Not recorded]'}\nClient reply: ${e.reply}\nFeedback: ${e.feedback}\nSources: ${e.refs.map(id=>DATA.sources[id].label).join('; ')}\n`;});
    s+='\nSOURCE BOUNDARIES\n'+DATA.scope+'\n\n'+DATA.references.join('\n')+'\n';return s;
  }
  function download(name,text,type){const blob=new Blob([text],{type});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
  async function copyReport(){try{if(!navigator.clipboard)throw Error('Clipboard unavailable');await navigator.clipboard.writeText(reportText());$('#export-status').textContent='Report copied. Paste it into your shared document.';}catch(_){download(current().id+'-group-report.txt',reportText(),'text/plain;charset=utf-8');const n=$('#export-status');if(n)n.textContent='Clipboard access was unavailable. A text report was downloaded instead.';}}
  document.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b||b.disabled)return;
    if(b.dataset.tab){state.tab=b.dataset.tab;save();render(true);return;}
    if(b.dataset.case){selectCase(b.dataset.case);return;}
    if(b.dataset.choice){choose(b.dataset.choice,$('#reason')?.value);return;}
    const a=b.dataset.action;
    if(a==='continue')continueConversation();
    if(a==='restart')restart();
    if(a==='help'){state.tab='instructor';save();render(true);}
    if(a==='export-text')download(current().id+'-group-report.txt',reportText(),'text/plain;charset=utf-8');
    if(a==='export-json')download(current().id+'-route-and-plan.json',JSON.stringify(reportObject(),null,2),'application/json');
    if(a==='copy')copyReport();
  });
  document.addEventListener('input',ev=>{const t=ev.target,r=record();if(!r)return;
    if(t.id==='reason')r.scratch=t.value;
    if(t.id==='group-name')r.group=t.value;
    if(t.dataset.plan)r.draft[t.dataset.plan]=t.value;
    save();
  });
  document.addEventListener('change',ev=>{const t=ev.target;
    if(t.id==='feedback-mode'){state.mode=t.value;save();}
    if(t.id==='require-reason'){state.requireReason=t.checked;save();}
    if(t.id==='matrix-case'){$('#matrix-detail').innerHTML=matrixView(DATA.cases.find(c=>c.id===t.value));}
  });
  window.SimulationAPI={data:DATA,getState:()=>JSON.parse(JSON.stringify(state)),selectCase,choose,continueConversation,restart,reportObject,reportText};
  render();
})();
</script></body></html>
